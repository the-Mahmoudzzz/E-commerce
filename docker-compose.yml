services:
  api:
    build: .
    container_name: ecommerce-api
    ports:
      - "5000:8080"  
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development  
      - ASPNETCORE_HTTP_PORTS=8080           
      - ConnectionStrings__DefaultConnection=Server=db;Database=MyDb;User=sa;Password=YourPassword123;TrustServerCertificate=True

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-db
    environment:
      SA_PASSWORD: "YourPassword123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: